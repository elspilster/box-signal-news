name: Update Box Signal News
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect latest headlines
        run: python scripts/update.py
      - name: Commit dated editions
        run: |
          git config user.name 'box-signal-news-bot'
          git config user.email 'box-signal-news-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily news archive'
            git push
          fi
